{% extends "core/dashboard_base.html" %}

{% block dashboard_content %}
<style>
    .eval-card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); padding: 30px; margin: 20px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; }
    input[type="number"], textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    .btn-submit { background: #28a745; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 16px; }
    .btn-submit:hover { background: #218838; }
</style>

<div class="eval-card">
    <h2>ارزیابی استاد: {{ professor_name }}</h2>
    <p>درس: <strong>{{ offering.course.title }}</strong></p>
    <hr>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_rating">نمره (از ۵):</label>
            {{ form.rating }}
        </div>
        
        <div class="form-group">
            <label for="id_comment">نظر شما:</label>
            {{ form.comment }}
        </div>

        <button type="submit" class="btn-submit">ثبت ارزیابی</button>
    </form>
</div>
{% endblock %}
